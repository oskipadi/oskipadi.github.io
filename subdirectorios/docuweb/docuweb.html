<!doctype html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>docuweb</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css" />
  <link href="docuweb.css" rel="stylesheet" type="text/css">
  <style>
    /* Small UI for the eye-transition overlay and helper classes */
    .video-hidden {
      display: none !important;
    }

    .video-visible {
      display: block !important;
    }

    #eye-overlay {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      background: rgba(255, 255, 255, 0.8);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      padding: 40px;
      border-radius: 30px;
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3);
      display: none;
      width: min(450px, 90%);
      text-align: center;
      font-family: 'Segoe UI', sans-serif;
      color: #000000;
    }

    #eye-overlay h3 {
      margin: 0 0 15px 0;
      font-size: 22px;
      font-weight: 600;
      color: #000000;
    }

    #eye-overlay p {
      margin: 0 0 20px 0;
      font-size: 16px;
      line-height: 1.5;
      color: #333333;
    }

    #eye-status {
      font-weight: 600;
      color: #000000;
      margin-bottom: 25px;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    #eye-fallback {
      padding: 15px 35px;
      background: #fffdfd;
      color: #000000;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #eye-fallback:hover {
      transform: scale(1.05);
    }

    /* Estilos para el nuevo menú de carga */
    #menu-carga-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.3);
    }

    .botones-menu-carga {
      display: flex;
      gap: 20px;
      z-index: 210;
    }

    .btn-premium {
      padding: 15px 30px;
      background: #fffdfd;
      color: #000000;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 500;
      cursor: pointer;
      transition: transform 0.2s, background 0.2s;
    }

    .btn-premium:hover {
      transform: scale(1.05);
      background: #f0f0f0;
    }

    .swiper-container-wrapper {
      width: 95%;
      height: 70%;
      display: none;
      flex-direction: column;
      gap: 10px;
      margin-top: 30px;
    }

    .swiper {
      width: 100%;
      margin-left: auto;
      margin-right: auto;
    }

    .swiper-slide {
      background-size: cover;
      background-position: center;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .swiper-slide img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 15px;
    }

    .mySwiper2 {
      height: 80%;
      width: 100%;
    }

    .mySwiper {
      height: 20%;
      width: 100%;
      box-sizing: border-box;
      padding: 10px 0;
    }

    .mySwiper .swiper-slide {
      width: 25%;
      height: 100%;
      opacity: 0.4;
      cursor: pointer;
    }

    .mySwiper .swiper-slide-thumb-active {
      opacity: 1;
    }

    .swiper-slide img {
      border-radius: 8px;
    }

    .texto-mapeo {
      color: white;
      font-size: 18px;
      margin-bottom: 30px;
      text-align: center;
      max-width: 800px;
      line-height: 1.6;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
      font-family: 'Segoe UI', sans-serif;
      display: none;
    }
  </style>
</head>

<body>

  <!-- Pantalla de Carga -->
  <div id="loading-screen"
    style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #08070F; z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; transition: opacity 1s ease-in-out;">
    <div
      style="width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-top-color: #ffffff; border-radius: 50%; animation: loading-spin 1s linear infinite;">
    </div>
    <p
      style="margin-top: 20px; font-family: 'Segoe UI', sans-serif; color: white; letter-spacing: 2px; font-size: 12px;">
      CARGANDO EXPERIENCIA...</p>
    <div
      style="width: 200px; height: 2px; background: rgba(255,255,255,0.1); margin-top: 15px; border-radius: 2px; overflow: hidden;">
      <div id="loading-bar" style="width: 0%; height: 100%; background: white; transition: width 0.3s ease;"></div>
    </div>
  </div>

  <style>
    @keyframes loading-spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

  <div class="image-container2">
    <video playsinline id="video-background" poster="menu.png" muted
      style="width: 100%; height: 100%; object-fit: cover;">
      <!-- El src se asigna vía JS (Intro.webm) -->
    </video>

    <img src="menu.png" alt="menu" class="menu-image">
    <button id="start-button_1"
      style="position:absolute; left:50%; top:70%; transform:translate(-50%,-50%); width:120px; height:60px; background:#fffdfd; color:#000000; border:none; border-radius:30px; font-size:20px; cursor:pointer; z-index:5; display:block;">Play</button>
    <button id="start-button_2"
      style="position:absolute; left:50%; top:55%; transform:translate(-400%,100%); width:80px; height:80px; background:#e53935; color:#fff; border:none; border-radius:50%; font-size:28px; cursor:pointer; z-index:5; display:none;">▶</button>

    <video muted playsinline id="video-parte1"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none;">
    </video>

    <video muted playsinline id="video-parte2"
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none;">
    </video>

    <button id="skip-intro"
      style="position: absolute; bottom: 20px; right: 20px; padding: 12px 24px; background: rgba(255,255,255,0.9); border: 2px solid white; cursor: pointer; border-radius: 5px; font-size: 16px; font-weight: bold; z-index: 4;">Skip
      intro</button>

    <video muted playsinline id="video-pantalla_carga_1" loop
      style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; pointer-events: none;">
    </video>

    <!-- Nuevo Menú Interactivo sobre Pantalla de Carga 1 -->
    <div id="menu-carga-1">
      <p class="texto-mapeo">Estos mapeos son fruto de una sesión sobre relaciones en la que se trabajó dividiendo en 3
        grupos.</p>
      <div class="botones-menu-carga">
        <button id="btn-relaciones" class="btn-premium">Relaciones y no monogamias</button>
        <button id="btn-continuar-carga" class="btn-premium">Continuar</button>
      </div>

      <div class="swiper-container-wrapper" id="swiper-wrapper-mapeo">
        <!-- Main Swiper -->
        <div class="swiper mySwiper2">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="mapeo_1.png" /></div>
            <div class="swiper-slide"><img src="mapeo_2.png" /></div>
            <div class="swiper-slide"><img src="mapeo_3.png" /></div>
          </div>
          <div class="swiper-button-next"></div>
          <div class="swiper-button-prev"></div>
        </div>

        <!-- Thumbs Swiper -->
        <div class="swiper mySwiper">
          <div class="swiper-wrapper">
            <div class="swiper-slide"><img src="mapeo_1.png" /></div>
            <div class="swiper-slide"><img src="mapeo_2.png" /></div>
            <div class="swiper-slide"><img src="mapeo_3.png" /></div>
          </div>
        </div>
      </div>
    </div>

    <div id="countdown-overlay"
      style="position:absolute; top:20px; right:20px; z-index:10; padding:8px 12px; background:rgba(0,0,0,0.6); color:#ffffff; border-radius:15px; font-size:40px; display:none; pointer-events:none;">
      00</div>

    <!-- Overlay used while waiting for eye-close to transition -->
    <div id="eye-overlay" aria-hidden="true">
      <h3>Cierra los ojos para empezar la dinámica</h3>
      <div id="eye-status">Esperando vídeo...</div>
      <div style="margin-top:12px">
        <button id="eye-fallback">Continuar manualmente</button>
      </div>
    </div>

  </div>

  <script type="module">
    // Nota: la detección ocular se importará dinámicamente solo durante la transición

    const video = document.getElementById('video-background');
    const videoParte1 = document.getElementById('video-parte1');
    const videoParte2 = document.getElementById('video-parte2');
    const countdownOverlay = document.getElementById('countdown-overlay');
    const skipIntro = document.getElementById('skip-intro');
    const menuImage = document.querySelector('.menu-image');
    const startButton1 = document.getElementById('start-button_1');
    const startButton2 = document.getElementById('start-button_2');
    const eyeOverlay = document.getElementById('eye-overlay');
    const eyeStatus = document.getElementById('eye-status');
    const eyeFallback = document.getElementById('eye-fallback');
    const loadingScreen = document.getElementById('loading-screen');
    const loadingBar = document.getElementById('loading-bar');
    const videoPantallaCarga1 = document.getElementById('video-pantalla_carga_1');

    // Lógica de Pre-carga de Videos
    const videosToLoad = [
      { id: 'video-background', src: 'intro.webm' },
      { id: 'video-parte1', src: 'parte_1.webm' },
      { id: 'video-parte2', src: 'parte_2.webm' },
      { id: 'video-pantalla_carga_1', src: 'pantalla_carga_1.webm' }
    ];

    let loadedCount = 0;

    const hideLoadingScreen = () => {
      loadingScreen.style.opacity = '0';
      setTimeout(() => {
        loadingScreen.style.display = 'none';
        video.pause();
        video.currentTime = 0;
      }, 1000);
    };

    videosToLoad.forEach(vInfo => {
      const vElem = document.getElementById(vInfo.id);
      vElem.src = vInfo.src;
      vElem.preload = "auto";
      vElem.load();

      vElem.oncanplay = () => {
        if (!vElem.dataset.loaded) {
          vElem.dataset.loaded = "true";
          loadedCount++;
          loadingBar.style.width = (loadedCount / videosToLoad.length * 100) + "%";
          if (loadedCount === videosToLoad.length) {
            hideLoadingScreen();
          }
        }
      };

      vElem.onerror = () => {
        console.error("Error cargando:", vInfo.src);
        vElem.oncanplay();
      };
    });

    setTimeout(() => {
      if (loadedCount < videosToLoad.length) {
        console.warn("Timeout de carga");
        hideLoadingScreen();
      }
    }, 10000);

    video.addEventListener('ended', () => {
      menuImage.classList.add('visible');
      video.classList.add('video-hidden');
      skipIntro.style.display = 'none';
      startButton2.style.display = 'block';
    });

    skipIntro.addEventListener('click', () => {
      video.pause();
      startButton1.style.display = 'none';
      menuImage.classList.add('visible');
      startButton2.style.display = 'block';
      video.classList.add('video-hidden');
      skipIntro.style.display = 'none';
    });

    startButton1.addEventListener('click', () => {
      video.muted = false;
      video.play().catch(err => {
        video.muted = true;
        video.play();
      });
      startButton1.style.display = 'none';
      skipIntro.style.display = 'block';
    });

    startButton2.addEventListener('click', () => {
      menuImage.classList.remove('visible');
      startButton2.style.display = 'none';

      // Hacer visible el video de la Parte 1
      videoParte1.style.opacity = '1';
      videoParte1.style.pointerEvents = 'auto';

      videoParte1.muted = false;
      videoParte1.play();
    });


    // Cuando termine la parte 1, mostramos la superposición y arrancamos la detección ocular
    videoParte1.addEventListener('ended', async () => {
      // Ocultamos el vídeo 1 y mostramos la parte 2 pero congelada (pausada) detrás del overlay
      videoParte1.style.opacity = '0';
      videoParte1.style.pointerEvents = 'none';
      // Preparar video-parte2 como fondo congelado
      videoParte2.style.opacity = '1';
      videoParte2.style.pointerEvents = 'auto';
      videoParte2.muted = false;
      try { videoParte2.pause(); } catch (e) { }
      try { videoParte2.currentTime = 0; } catch (e) { }

      // Mostrar overlay de control ocular sobre video-parte2
      eyeOverlay.style.display = 'block';
      eyeOverlay.setAttribute('aria-hidden', 'false');
      eyeStatus.textContent = 'Comprobando cámara...';

      // Import dinámico para no afectar a los botones iniciales
      let cerrarojosMod;
      try {
        cerrarojosMod = await import(new URL('./cerrarojos.js', import.meta.url).href);
      } catch (e) {
        console.error('Error al cargar módulo de detección ocular:', e);
        eyeStatus.textContent = 'No se pudo cargar la detección ocular. Abre el archivo desde un servidor local o revisa la ruta.';
        return;
      }

      const webcamOk = await cerrarojosMod.comprobarWebcam().catch(() => false);
      if (!webcamOk) {
        eyeStatus.textContent = 'No se detectó webcam. Usa el botón para continuar manualmente.';
        return;
      }

      eyeStatus.textContent = 'Escuchando cierre de ojos...';

      // Iniciar la detección; al detectar, reproducimos video-parte2 desde el inicio
      cerrarojosMod.iniciarDeteccionSalto('video-parte2').then(() => {
        eyeOverlay.style.display = 'none';
        try { videoParte2.currentTime = 0; } catch (e) { }
        videoParte2.play();
      }).catch((err) => {
        console.error('Detección ocular cancelada o error:', err);
        eyeStatus.textContent = 'Error en detección ocular. Usa el botón para continuar manualmente.';
      });
    });

    eyeFallback.addEventListener('click', () => {
      // Fallback manual: reproducir parte 2
      eyeOverlay.style.display = 'none';
      videoParte2.style.opacity = '1';
      videoParte2.style.pointerEvents = 'auto';

      videoParte2.muted = false;
      videoParte2.play().catch(err => {
        videoParte2.muted = true;
        videoParte2.play();
      });
    });

    videoParte2.addEventListener('ended', () => {
      // Ocultar Parte 2 y mostrar Pantalla de Carga 1 en Loop
      videoParte2.style.opacity = '0';
      videoParte2.style.pointerEvents = 'none';

      videoPantallaCarga1.style.opacity = '1';
      videoPantallaCarga1.style.pointerEvents = 'auto';
      videoPantallaCarga1.muted = false;
      videoPantallaCarga1.loop = true;
      videoPantallaCarga1.play();

      // Mostrar el menú interactivo
      document.getElementById('menu-carga-1').style.display = 'flex';
    });

    // Lógica del nuevo menú
    const btnRelaciones = document.getElementById('btn-relaciones');
    const btnContinuarCarga = document.getElementById('btn-continuar-carga');
    const swiperWrapper = document.getElementById('swiper-wrapper-mapeo');
    let swiperInstance = null;

    btnRelaciones.addEventListener('click', () => {
      swiperWrapper.style.display = 'flex';
      document.querySelector('.texto-mapeo').style.display = 'block';
      btnRelaciones.style.display = 'none';

      // Inicializar Swiper si no existe
      if (!swiperInstance) {
        const swiperThumbs = new Swiper(".mySwiper", {
          spaceBetween: 10,
          slidesPerView: 3,
          freeMode: true,
          watchSlidesProgress: true,
        });

        swiperInstance = new Swiper(".mySwiper2", {
          spaceBetween: 10,
          navigation: {
            nextEl: ".swiper-button-next",
            prevEl: ".swiper-button-prev",
          },
          thumbs: {
            swiper: swiperThumbs,
          },
        });
      }
    });

    btnContinuarCarga.addEventListener('click', () => {
      // Aquí puedes definir qué pasa al continuar
      document.getElementById('menu-carga-1').style.display = 'none';
      videoPantallaCarga1.style.opacity = '0';
      videoPantallaCarga1.pause();
      // Por ahora lo ocultamos, puedes añadir aquí la siguiente transición
    });

  </script>
  <script src="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.js"></script>

</body>

</html>
