<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
  <title>DocuWeb - Versión móvil</title>
  <style>
    html,body{height:100%;margin:0;font-family:system-ui,Arial,Helvetica,sans-serif;background:#000;color:#fff}
    #loading-screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;z-index:50;font-size:1.1rem}
    #overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#000;z-index:40;padding:1rem;box-sizing:border-box;text-align:center}
    #phoneVideo{width:100%;max-height:70vh;background:#000;border-radius:8px;display:block}
    #prompt{margin-top:1rem;font-size:1.05rem;line-height:1.4;max-width:92%}
    #rotateHint{margin-top:0.75rem;color:#ddd;font-size:0.95rem}
    .hidden{display:none !important}
    @media (orientation: landscape) {
      #phoneVideo{max-height:none;height:100vh;width:100%;border-radius:0}
      #rotateHint{display:none}
    }
  </style>
  <meta name="robots" content="noindex">
</head>
<body>
  <div id="loading-screen">Cargando…</div>
  <div id="overlay" class="hidden">
    <video id="phoneVideo" playsinline muted preload="metadata">
      <source src="https://customer-rkin2iztax47x9b5.cloudflarestream.com/88adbd8510319eed50482b7f6b311a42/manifest/video.m3u8" type="application/x-mpegURL">
    </video>
    <div id="prompt">Gira tu móvil a horizontal para ir al contenido.</div>
    <div id="rotateHint">Cuando el móvil esté en horizontal, se abrirá el contenido.</div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <script>
    const PHONE_VIDEO_URL = 'https://customer-rkin2iztax47x9b5.cloudflarestream.com/88adbd8510319eed50482b7f6b311a42/manifest/video.m3u8';
    const INTRO_VIDEO_URL = 'https://customer-rkin2iztax47x9b5.cloudflarestream.com/43385aff7a1ec19f10482f68a1394852/manifest/video.m3u8';
    
    const loading = document.getElementById('loading-screen');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('phoneVideo');
    const prompt = document.getElementById('prompt');
    const rotateHint = document.getElementById('rotateHint');
    
    let hlsInstance = null;
    let videoSequence = 0;
    let phoneVideoEnded = false;
    let introVideoReadyToRedirect = false;

    function setupHls(url) {
      try {
        if (window.Hls && Hls.isSupported()) {
          if (hlsInstance) hlsInstance.destroy();
          hlsInstance = new Hls();
          hlsInstance.loadSource(url);
          hlsInstance.attachMedia(video);
          hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
            video.play().catch(e => console.log('Play error:', e));
          });
        } else {
          video.src = url;
          video.play().catch(e => console.log('Play error:', e));
        }
      } catch (e) {
        console.error('HLS setup error:', e);
      }
    }

    function playPhoneVideo() {
      videoSequence = 0;
      phoneVideoEnded = false;
      console.log('Playing phone video');
      setupHls(PHONE_VIDEO_URL);
    }

    function playIntroVideo() {
      videoSequence = 1;
      introVideoReadyToRedirect = false;
      console.log('Playing intro video');
      setupHls(INTRO_VIDEO_URL);
    }

    function finishLoading() {
      loading.classList.add('hidden');
      overlay.classList.remove('hidden');
      playPhoneVideo();
      checkOrientation();
    }

    function redirectToContent() {
      console.log('Redirecting to desktop');
      try { video.pause(); } catch (e) {}
      if (hlsInstance && hlsInstance.destroy) try { hlsInstance.destroy(); } catch (e) {}
      window.location.replace('docuweb.html');
    }

    function updateOrientationUI(isLandscape) {
      if (!isLandscape) {
        overlay.classList.remove('horizontal-only');
        overlay.classList.add('portrait-only');
        if (prompt) prompt.textContent = 'Gira el móvil a horizontal para continuar con el contenido.';
        if (rotateHint) rotateHint.style.display = 'block';
        if (videoSequence === 1) {
          try { video.pause(); } catch (e) {}
        }
        return;
      }

      overlay.classList.add('horizontal-only');
      overlay.classList.remove('portrait-only');
      if (videoSequence === 0) {
        if (phoneVideoEnded) {
          if (prompt) prompt.textContent = 'Reproduciendo contenido en horizontal...';
          if (rotateHint) rotateHint.style.display = 'none';
        } else {
          if (prompt) prompt.textContent = 'Contenido horizontal en reproducción.';
          if (rotateHint) rotateHint.style.display = 'none';
        }
      } else if (videoSequence === 1) {
        if (prompt) prompt.textContent = 'Reproduciendo contenido principal en horizontal.';
        if (rotateHint) rotateHint.style.display = 'none';
        if (isLandscape && video.paused && !introVideoReadyToRedirect) {
          video.play().catch(() => {});
        }
      }
    }

    function checkOrientation() {
      const isLandscape = window.matchMedia('(orientation: landscape)').matches || window.innerWidth > window.innerHeight;
      console.log('Check orientation - landscape:', isLandscape, 'seq:', videoSequence, 'ended:', phoneVideoEnded);
      updateOrientationUI(isLandscape);

      if (!isLandscape) {
        return;
      }

      if (videoSequence === 0 && phoneVideoEnded) {
        playIntroVideo();
      } else if (videoSequence === 1 && introVideoReadyToRedirect) {
        redirectToContent();
      } else if (videoSequence === 1 && !introVideoReadyToRedirect && video.paused) {
        video.play().catch(() => {});
      }
    }

    video.addEventListener('ended', () => {
      console.log('Video ended - sequence:', videoSequence);
      if (videoSequence === 0) {
        phoneVideoEnded = true;
        checkOrientation();
      } else if (videoSequence === 1) {
        introVideoReadyToRedirect = true;
        checkOrientation();
      }
    });

    window.addEventListener('load', () => setTimeout(finishLoading, 300));
    window.addEventListener('orientationchange', () => setTimeout(checkOrientation, 250));
    window.addEventListener('resize', () => setTimeout(checkOrientation, 150));
  </script>
</body>
</html>
